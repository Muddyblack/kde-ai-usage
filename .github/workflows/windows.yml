name: Windows

# The portable half of the tests (tests/python) on Windows and Linux, the tray
# app's QML loaded headless on both, and the Windows build. Releases attach the
# build through release.yml.

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: package/contents/tools
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: install
        run: python -m pip install -r windows/requirements.txt

      - name: unit tests
        run: python -m unittest discover -s tests/python -v

      - name: backend smoke run
        run: python -m aiusage --provider claude,antigravity,openai

      - name: tray app loads
        run: python windows/app.py --selftest

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: build
        run: |
          python -m pip install -r windows/requirements.txt pyinstaller pillow
          pyinstaller --noconfirm windows/ai-usage.spec

      - name: bundled app loads
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath "dist/AI Usage/AI Usage.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }

      - name: zip
        shell: pwsh
        run: Compress-Archive -Path "dist/AI Usage" -DestinationPath ai-usage-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ai-usage-windows
          path: ai-usage-windows.zip
