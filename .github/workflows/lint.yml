name: Lint

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  qml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v27

      - name: qmllint
        run: nix develop --command bash -c 'find package/contents -name "*.qml" | xargs qmllint --unresolved-type info'

      - name: qmlformat check
        run: nix develop --command bash -c 'find package/contents -name "*.qml" | xargs qmlformat --dry-run 2>&1 | grep -q "would reformat" && echo "Files need formatting, run qmlformat -i" && exit 1 || true'

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: ruff check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "check package/contents/tools/aiusage windows tests/python"

      - name: ruff format check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "format --check package/contents/tools/aiusage windows tests/python"

      - name: provider contract tests
        run: ./tests/get-ai-usage.test.sh

      - name: terminal frontend tests
        run: ./tests/ai-usage-cli.test.sh

      - name: credential discovery tests
        run: ./tests/credentials.test.sh

      - name: interpreter resolution tests
        run: ./tests/python-interp.test.sh

      - name: shared history file tests
        run: ./tests/history-io.test.sh

      - name: codex helper tests
        run: |
          ./tests/get-codex-stats.test.sh
          ./tests/get-codex-rate-limits.test.sh

      - name: shared frontend code tests
        run: node --test tests/*.test.js
