name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the Windows tray app
        run: |
          python -m pip install -r windows/requirements.txt pyinstaller pillow
          pyinstaller --noconfirm windows/ai-usage.spec

      - name: Zip it
        shell: pwsh
        run: Compress-Archive -Path "dist/AI Usage" -DestinationPath "ai-usage-windows-$env:GITHUB_REF_NAME.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ai-usage-windows-*.zip

  release:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build .plasmoid
        run: make pack

      - uses: actions/download-artifact@v4
        with:
          name: windows

      - name: Get version and artifact path
        id: info
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="$(basename "$PWD")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact=${NAME}-${VERSION}.plasmoid" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG="$(git tag --sort=-creatordate | grep -E '^v' | sed -n '2p')"
          if [ -n "$PREV_TAG" ]; then
            NOTES="$(git log "${PREV_TAG}..HEAD" --pretty=format:'- %s' --no-merges)"
          else
            NOTES="$(git log --pretty=format:'- %s' --no-merges)"
          fi
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.info.outputs.version }}
          body: |
            ## Changes
            ${{ steps.notes.outputs.notes }}

            ---
            Install by downloading the `.plasmoid` file and running:
            ```
            plasmapkg2 -i ${{ steps.info.outputs.artifact }}
            ```

            **Windows:** unzip `ai-usage-windows-${{ github.ref_name }}.zip` anywhere and run `AI Usage.exe`; it lives in the tray.
          files: |
            ${{ steps.info.outputs.artifact }}
            ai-usage-windows-*.zip
