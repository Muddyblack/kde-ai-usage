<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
<defs>
  <linearGradient id="panelBg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#181922"/>
    <stop offset="100%" stop-color="#111218"/>
  </linearGradient>
  <linearGradient id="epic-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ff007f" />
    <stop offset="35%" stop-color="#a855f7" />
    <stop offset="70%" stop-color="#00f0ff" />
    <stop offset="100%" stop-color="#00ff7f" />
  </linearGradient>

  <!-- Reusable Switch ON -->
  <g id="switch-on">
    <rect width="24" height="13" rx="6.5" fill="#3a86c8"/>
    <circle cx="17.5" cy="6.5" r="4.5" fill="#1e2022" stroke="#3a86c8" stroke-width="1"/>
  </g>

  <!-- Reusable Switch OFF -->
  <g id="switch-off">
    <rect width="24" height="13" rx="6.5" fill="#31363b"/>
    <circle cx="6.5" cy="6.5" r="4.5" fill="#1e2022" stroke="#7f8c8d" stroke-width="1"/>
  </g>

  <!-- Reusable ToolButton Chevron Down -->
  <g id="chevron-down">
    <rect width="18" height="18" rx="3" fill="transparent"/>
    <path d="M 5,7 L 9,11 L 13,7" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Reusable ToolButton Chevron Up -->
  <g id="chevron-up">
    <rect width="18" height="18" rx="3" fill="rgba(255,255,255,0.06)"/>
    <path d="M 5,11 L 9,7 L 13,11" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Reusable Eye Icon -->
  <g id="eye-icon">
    <path d="M 0,3 C 3,0 9,0 12,3 C 9,6 3,6 0,3 Z" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.2" stroke-linejoin="round"/>
    <circle cx="6" cy="3" r="1.5" fill="rgba(255,255,255,0.45)"/>
  </g>
</defs>

<!-- Card Background -->
<rect width="400" height="480" rx="12" fill="url(#panelBg)"/>
<rect width="400" height="480" rx="12" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.2"/>

<!-- Header -->
<g transform="translate(16, 16)">
  <g transform="translate(0, 1) scale(0.85)">
    <path d="M 3.5,10 A 8.5,8.5 0 0,0 20.5,10" fill="none" stroke="url(#epic-gradient)" stroke-width="1.8" stroke-linecap="round" />
    <path d="M 6.5,10 A 5.5,5.5 0 0,0 17.5,10" fill="none" stroke="url(#epic-gradient)" stroke-width="1.8" stroke-linecap="round" opacity="0.6" />
    <path d="M 12,2 C 12,6.5 13.5,8 18,8 C 13.5,8 12,9.5 12,14 C 12,9.5 10.5,8 6,8 C 10.5,8 12,6.5 12,2 Z" fill="url(#epic-gradient)" />
    <path d="M 18.5,1.5 C 18.5,2.7 18.9,3.1 20.1,3.1 C 18.9,3.1 18.5,3.5 18.5,4.7 C 18.5,3.5 18.1,3.1 16.9,3.1 C 18.1,3.1 18.5,2.7 18.5,1.5 Z" fill="url(#epic-gradient)" />
  </g>
  <text x="26" y="11" font-size="14.5" font-weight="bold" fill="#ffffff" font-family="system-ui,-apple-system,sans-serif">Settings</text>
  <text x="26" y="24" font-size="9.5" fill="rgba(255,255,255,0.5)" font-family="system-ui,-apple-system,sans-serif">Turn providers on and set their keys</text>

  <!-- Back Button -->
  <rect x="318" y="2" width="22" height="22" rx="4" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
  <path d="M 331,8 L 325,13 L 331,18 M 325,13 L 334,13" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Refresh Button -->
  <rect x="346" y="2" width="22" height="22" rx="4" fill="transparent" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <path d="M 357,9 A 4.5,4.5 0 1,0 360,12.5 M 360,9 L 360,12.5 L 356.5,12.5" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
</g>

<!-- Divider -->
<rect x="16" y="48" width="368" height="1" fill="rgba(255,255,255,0.08)" />

<!-- SubTabBar (Sections: Providers, Appearance, Data, Advanced) -->
<g transform="translate(16, 56)">
  <rect width="368" height="26" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)" stroke-width="1" />
  <!-- Providers Tab (Active) -->
  <rect x="2" y="2" width="89" height="22" rx="5" fill="rgba(58,134,200,0.20)" stroke="rgba(58,134,200,0.35)" stroke-width="1" />
  <text x="46.5" y="17" font-size="11" font-weight="bold" fill="#3a86c8" font-family="system-ui,-apple-system,sans-serif" text-anchor="middle">Providers</text>
  <!-- Appearance Tab -->
  <text x="137.5" y="17" font-size="11" fill="rgba(255,255,255,0.6)" font-family="system-ui,-apple-system,sans-serif" text-anchor="middle">Appearance</text>
  <!-- Data Tab -->
  <text x="228.5" y="17" font-size="11" fill="rgba(255,255,255,0.6)" font-family="system-ui,-apple-system,sans-serif" text-anchor="middle">Data</text>
  <!-- Advanced Tab -->
  <text x="320.5" y="17" font-size="11" fill="rgba(255,255,255,0.6)" font-family="system-ui,-apple-system,sans-serif" text-anchor="middle">Advanced</text>
</g>

<!-- Providers Section List -->

<!-- 1. Claude (ON, Expanded) -->
<g transform="translate(0, 92)">
  <circle cx="20" cy="10" r="3.5" fill="#cc785c" />
  <text x="32" y="14" font-size="11" font-weight="bold" fill="#ffffff" font-family="system-ui,-apple-system,sans-serif">Claude</text>
  <use href="#switch-on" x="120" y="4" />
  <use href="#chevron-up" x="366" y="1" />
  <!-- Expanded API Key Row -->
  <g transform="translate(0, 23)">
    <text x="29" y="14" font-size="10" fill="rgba(255,255,255,0.6)" font-family="system-ui,-apple-system,sans-serif">API key</text>
    <rect x="108" y="1" width="244" height="20" rx="3" fill="#13141a" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <text x="116" y="14" font-size="9" fill="rgba(255,255,255,0.5)" font-family="monospace">sk-ant-api03-••••••••••••••••</text>
    <rect x="358" y="1" width="24" height="20" rx="3" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <use href="#eye-icon" x="364" y="8" />
  </g>
</g>

<!-- 2. Antigravity (ON) -->
<g transform="translate(0, 143)">
  <circle cx="20" cy="10" r="3.5" fill="#4285f4" />
  <text x="32" y="14" font-size="11" fill="#ffffff" font-family="system-ui,-apple-system,sans-serif">Antigravity</text>
  <use href="#switch-on" x="120" y="4" />
</g>

<!-- 3. OpenAI (ON) -->
<g transform="translate(0, 168)">
  <circle cx="20" cy="10" r="3.5" fill="#10a37f" />
  <text x="32" y="14" font-size="11" fill="#ffffff" font-family="system-ui,-apple-system,sans-serif">OpenAI</text>
  <use href="#switch-on" x="120" y="4" />
  <text x="358" y="13" font-size="9" fill="rgba(255,255,255,0.4)" font-family="system-ui,-apple-system,sans-serif" text-anchor="end">key set</text>
  <use href="#chevron-down" x="366" y="1" />
</g>

<!-- 4. Kiro (ON) -->
<g transform="translate(0, 193)">
  <circle cx="20" cy="10" r="3.5" fill="#8b5cf6" />
  <text x="32" y="14" font-size="11" fill="#ffffff" font-family="system-ui,-apple-system,sans-serif">Kiro</text>
  <use href="#switch-on" x="120" y="4" />
</g>

<!-- 5. Mistral (OFF) -->
<g transform="translate(0, 218)">
  <circle cx="20" cy="10" r="3.5" fill="#ff7000" opacity="0.35" />
  <text x="32" y="14" font-size="11" fill="rgba(255,255,255,0.6)" font-family="system-ui,-apple-system,sans-serif">Mistral</text>
  <use href="#switch-off" x="120" y="4" />
</g>

<!-- 6. OpenRouter (OFF) -->
<g transform="translate(0, 243)">
  <circle cx="20" cy="10" r="3.5" fill="#9333ea" opacity="0.35" />
  <text x="32" y="14" font-size="11" fill="rgba(255,255,255,0.6)" font-family="system-ui,-apple-system,sans-serif">OpenRouter</text>
  <use href="#switch-off" x="120" y="4" />
</g>

<!-- 7. Grok (ON) -->
<g transform="translate(0, 268)">
  <circle cx="20" cy="10" r="3.5" fill="#e6e6e6" />
  <text x="32" y="14" font-size="11" fill="#ffffff" font-family="system-ui,-apple-system,sans-serif">Grok</text>
  <use href="#switch-on" x="120" y="4" />
  <text x="358" y="13" font-size="9" fill="rgba(255,255,255,0.4)" font-family="system-ui,-apple-system,sans-serif" text-anchor="end">key set</text>
  <use href="#chevron-down" x="366" y="1" />
</g>

<!-- 8. Z.AI (OFF) -->
<g transform="translate(0, 293)">
  <circle cx="20" cy="10" r="3.5" fill="#126ef4" opacity="0.35" />
  <text x="32" y="14" font-size="11" fill="rgba(255,255,255,0.6)" font-family="system-ui,-apple-system,sans-serif">Z.AI</text>
  <use href="#switch-off" x="120" y="4" />
</g>

<!-- 9. Copilot (ON) -->
<g transform="translate(0, 318)">
  <circle cx="20" cy="10" r="3.5" fill="#8b5cf6" />
  <text x="32" y="14" font-size="11" fill="#ffffff" font-family="system-ui,-apple-system,sans-serif">Copilot</text>
  <use href="#switch-on" x="120" y="4" />
  <text x="358" y="13" font-size="9" fill="rgba(255,255,255,0.4)" font-family="system-ui,-apple-system,sans-serif" text-anchor="end">key set</text>
  <use href="#chevron-down" x="366" y="1" />
</g>

<!-- 10. DeepSeek (OFF) -->
<g transform="translate(0, 343)">
  <circle cx="20" cy="10" r="3.5" fill="#4f8cff" opacity="0.35" />
  <text x="32" y="14" font-size="11" fill="rgba(255,255,255,0.6)" font-family="system-ui,-apple-system,sans-serif">DeepSeek</text>
  <use href="#switch-off" x="120" y="4" />
</g>

<!-- 11. Kimi (OFF) -->
<g transform="translate(0, 368)">
  <circle cx="20" cy="10" r="3.5" fill="#2b4c9f" opacity="0.5" />
  <text x="32" y="14" font-size="11" fill="rgba(255,255,255,0.6)" font-family="system-ui,-apple-system,sans-serif">Kimi</text>
  <use href="#switch-off" x="120" y="4" />
</g>

<!-- 12. Muse (ON - Tristate SubTabBar: Off / Local / Live) -->
<g transform="translate(0, 393)">
  <circle cx="20" cy="10" r="3.5" fill="#0064e0" />
  <text x="32" y="14" font-size="11" fill="#ffffff" font-family="system-ui,-apple-system,sans-serif">Muse</text>
  <g transform="translate(120, 0)">
    <rect width="168" height="20" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)" stroke-width="1" />
    <!-- Off -->
    <text x="28" y="14" font-size="9.5" fill="rgba(255,255,255,0.55)" font-family="system-ui,-apple-system,sans-serif" text-anchor="middle">Off</text>
    <!-- Local (Active) -->
    <rect x="57" y="2" width="54" height="16" rx="3" fill="rgba(0,100,224,0.25)" stroke="rgba(0,100,224,0.45)" stroke-width="1" />
    <text x="84" y="14" font-size="9.5" font-weight="bold" fill="#4fa2f5" font-family="system-ui,-apple-system,sans-serif" text-anchor="middle">Local</text>
    <!-- Live -->
    <text x="140" y="14" font-size="9.5" fill="rgba(255,255,255,0.55)" font-family="system-ui,-apple-system,sans-serif" text-anchor="middle">Live</text>
  </g>
  <use href="#chevron-down" x="366" y="1" />
</g>

<!-- Footer Tip -->
<g transform="translate(16, 436)">
  <text x="0" y="9" font-size="9" fill="rgba(255,255,255,0.4)" font-family="system-ui,-apple-system,sans-serif">Expand a provider for its API key and options. Keys are optional wherever a local</text>
  <text x="0" y="21" font-size="9" fill="rgba(255,255,255,0.4)" font-family="system-ui,-apple-system,sans-serif">CLI login can be read instead.</text>
</g>

</svg>
